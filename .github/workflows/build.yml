name: Build iOS Dylib (Theos Ubuntu)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot git subversion perl clang lld libtinfo-dev curl unzip

      - name: Install Theos & iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/*.sdk ~/theos/sdks/
          rm -rf master.zip sdks-master

      - name: Compile KeyAuth.dylib
        run: |
          export THEOS=~/theos
          SDK_PATH=$(ls -d ~/theos/sdks/iPhoneOS*.sdk | tail -n 1)
          echo "Using SDK: $SDK_PATH"
          
          ~/theos/toolchain/linux/iphone/bin/clang \
            -target arm64-apple-ios13.0 \
            -dynamiclib -fobjc-arc \
            -isysroot "$SDK_PATH" \
            -F "$SDK_PATH/System/Library/Frameworks" \
            -framework Foundation -framework UIKit \
            KeyAuth.m -o KeyAuth.dylib

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyAuth-dylib
          path: KeyAuth.dylib
